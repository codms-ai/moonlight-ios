name: iPad IPA

# Builds an unsigned Moonlight Display .ipa for real iPads.
# Sign and install it from Windows with Sideloadly (free Apple ID works).

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ipa:
    name: Build unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download iOS platform
        run: xcodebuild -downloadPlatform iOS

      - name: Build for device (no signing)
        run: |
          set -o pipefail
          xcodebuild -project Moonlight.xcodeproj \
            -scheme Moonlight \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tail -n 200

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "App bundle: $APP"
          test -n "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry MoonlightDisplay.ipa Payload
          ls -lh MoonlightDisplay.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MoonlightDisplay-ipa
          path: MoonlightDisplay.ipa
          retention-days: 30
